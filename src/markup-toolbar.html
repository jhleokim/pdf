<div class="anno-bar" id="annoBar" hidden>
  <div class="annotation-tools" role="toolbar" aria-label="문서 편집 도구">
    <div class="ab-group" role="group" aria-label="선택·텍스트·형광펜">
      <button class="ab-tool active" data-tool="none" title="선택 및 이동 · V" aria-label="선택 및 이동"><svg class="ic"><use href="#i-cursor"/></svg></button>
      <button class="ab-tool named-tool" data-tool="text" title="텍스트 추가 · T" aria-label="텍스트 추가"><svg class="ic"><use href="#i-text"/></svg><span>텍스트</span></button>
      <button class="ab-tool named-tool" data-tool="highlight" title="형광펜 · H" aria-label="형광펜"><svg class="ic"><use href="#i-highlight"/></svg><span>형광펜</span></button>
    </div>
    <span class="markup-separator" aria-hidden="true"></span>
    <div class="ab-group" role="group" aria-label="도형·이미지">
      <button class="ab-tool" data-tool="rect" title="사각형" aria-label="사각형"><svg class="ic"><use href="#i-rect"/></svg></button>
      <button class="ab-tool" data-tool="ellipse" title="타원" aria-label="타원"><svg class="ic"><use href="#i-ellipse"/></svg></button>
      <button class="ab-tool" data-tool="cloud" title="수정 구름" aria-label="수정 구름"><svg class="ic"><use href="#i-review-cloud"/></svg></button>
      <button class="ab-tool" data-tool="image" title="이미지 삽입" aria-label="이미지 삽입"><svg class="ic"><use href="#i-photo"/></svg></button>
    </div>
    <div class="annotation-actions">
      <button class="btn quiet icon" id="annoDel" disabled title="선택한 마크업 삭제" aria-label="선택한 마크업 삭제"><svg class="ic"><use href="#i-trash"/></svg></button>
      <details class="markup-menu"><summary aria-label="편집 메뉴" title="편집 메뉴">···</summary><div><button class="btn quiet history-action" id="editUndo" aria-label="되돌리기" aria-keyshortcuts="Control+Z Meta+Z" disabled><span>되돌리기</span><small>Ctrl+Z</small></button><button class="btn quiet history-action" id="editRedo" aria-label="다시 실행" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled><span>다시 실행</span><small>Ctrl+Shift+Z</small></button><button class="btn quiet" id="annoClear" disabled>페이지 마크업 모두 삭제</button></div></details>
    </div>
  </div>
  <div class="markup-context" id="markupContext">
  <div id="highlightProperties" class="highlight-properties" hidden>
    <div class="highlight-modes" role="group" aria-label="강조 방식"><button id="highlightTextMode" aria-pressed="true">텍스트</button><button id="highlightAreaMode" aria-pressed="false">영역</button></div>
    <div class="highlight-colors" role="group" aria-label="형광펜 색상">
      <button data-highlight-color="#f4d35e" style="--swatch:#f4d35e" aria-label="노란색" aria-pressed="true"></button><button data-highlight-color="#9bd4ae" style="--swatch:#9bd4ae" aria-label="초록색" aria-pressed="false"></button><button data-highlight-color="#a7c9ed" style="--swatch:#a7c9ed" aria-label="파란색" aria-pressed="false"></button><button data-highlight-color="#f0b6c6" style="--swatch:#f0b6c6" aria-label="분홍색" aria-pressed="false"></button>
    </div>
    <label class="highlight-strength" title="형광펜 농도"><input id="highlightOpacity" type="range" min="15" max="65" step="5" value="35" aria-label="형광펜 농도"><output id="highlightOpacityValue">35%</output></label>
    <button class="btn quiet icon highlight-undo" id="highlightUndo" title="마지막 강조 취소" aria-label="마지막 강조 취소" disabled><svg class="ic"><use href="#i-markup-undo"/></svg></button>
  </div>
  <div id="annoProperties" class="annotation-properties" hidden>
    <div class="annotation-property-group" id="annoStrokeGroup" role="group" aria-label="테두리 설정">
      <span class="property-label">선</span>
      <span class="swatch"><input type="color" id="annoStroke" value="#BF342E" aria-label="테두리 색상"></span>
      <label class="stroke-width"><input type="number" id="annoWidth" min="0.5" max="12" step="0.5" value="2" aria-label="테두리 두께"><span>pt</span></label>
      <div class="ab-dash" role="group" aria-label="선 종류">
        <button class="ab-dbtn active" data-dash="solid" title="실선" aria-label="실선"><svg viewBox="0 0 22 8"><path d="M1 4h20"/></svg></button>
        <button class="ab-dbtn" data-dash="dashed" title="파선" aria-label="파선"><svg viewBox="0 0 22 8"><path d="M1 4h5M9 4h5M17 4h4"/></svg></button>
      </div>
    </div>
    <div class="annotation-property-group" role="group" aria-label="채움 설정">
      <span class="property-label">채움</span>
      <span class="swatch" id="fillSwatch"><input type="color" id="annoFill" value="#FFE082" aria-label="채움 색상"></span>
      <button class="ab-nofill" id="annoNoFill" title="채움 없음" aria-label="채움 없음" aria-pressed="false"><svg class="ic"><use href="#i-drop"/></svg></button>
      <label class="fill-opacity"><input type="range" id="annoOpacity" min="0" max="100" step="5" value="35" aria-label="채움 불투명도"><output id="annoOpacityVal">35%</output></label>
    </div>
  </div>
  <div id="textPropertiesHome"><div id="annoTextProperties" class="annotation-properties text-properties" hidden>
    <label class="text-font"><select id="textFont" aria-label="글꼴"><option value="gothic">나눔고딕</option><option value="myeongjo">나눔명조</option></select></label>
    <div class="text-size-control" role="group" aria-label="글씨 크기 조절"><label class="text-size-value"><input type="number" id="textSizeNumber" min="8" max="96" step="0.5" value="14" aria-label="글씨 크기 값"><span>pt</span></label><button type="button" id="textSizeDown" title="0.5 pt 줄이기" aria-label="글씨 크기 0.5 pt 줄이기">−</button><button type="button" id="textSizeUp" title="0.5 pt 키우기" aria-label="글씨 크기 0.5 pt 키우기">+</button></div>
    <div class="text-styles" role="group" aria-label="글자 서식"><button type="button" id="textBold" aria-label="굵게" title="굵게 · Ctrl / ⌘ + B" aria-keyshortcuts="Control+B Meta+B" aria-pressed="false">B</button><button type="button" id="textItalic" aria-label="기울임" title="기울임" aria-pressed="false">I</button><button type="button" id="textStrike" aria-label="취소선" title="취소선" aria-pressed="false">S</button></div>
    <div class="text-more"><span class="swatch text-color"><input type="color" id="textColor" value="#222222" aria-label="글자 색상"></span>
    <details class="text-format-details" id="textFormatDetails"><summary aria-label="텍스트 서식 자세히" title="크기·행간"><svg class="ic"><use href="#i-text-format"/></svg></summary><div class="text-format-popover">
      <label>크기<input type="range" id="textSize" min="8" max="96" step="0.5" value="14" aria-label="글씨 크기"><output id="textSizeValue">14 pt</output></label>
      <label>행간<input type="range" id="textLineGap" min="1" max="2" step="0.05" value="1.3" aria-label="텍스트 행간"><output id="textLineGapVal">130%</output></label>
    </div></details></div>
    <button class="btn quiet" id="textEdit" disabled title="선택한 텍스트 수정">수정</button>
    <div id="textEditorActions" class="inline-text-actions" hidden><button class="btn quiet icon" id="textCancel" title="취소 · Esc" aria-label="텍스트 입력 취소"><svg class="ic"><use href="#i-x"/></svg></button><button class="btn text-done" id="textApply" title="적용 · Ctrl / ⌘ + Enter" aria-label="텍스트 적용" disabled>적용</button></div>
  </div></div>
  <p id="annoImageHint" class="annotation-hint" hidden>드래그하여 이미지 배치</p>
  <p id="annoToolHint" class="annotation-hint" hidden></p>
  <span class="markup-idle" id="markupIdle">문서에서 편집할 위치를 선택하세요.</span>
  </div>
  <p id="textError" class="inline-text-error" role="alert"></p>
</div>
