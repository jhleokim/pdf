<dialog id="visionUnlockDialog" class="gemini-dialog" aria-labelledby="visionUnlockTitle">
  <form id="visionUnlockForm">
    <h2 id="visionUnlockTitle">Google Vision 활성화</h2>
    <label class="pro-field" for="visionUnlockPassword"><span>활성화 비밀번호</span><input id="visionUnlockPassword" type="password" autocomplete="off" spellcheck="false" maxlength="64" autofocus required aria-describedby="visionUnlockError"></label>
    <p id="visionUnlockError" class="pro-hint" role="status"></p>
    <div class="stamp-actions"><button class="btn" id="visionUnlockCancel" type="button">취소</button><button class="btn primary" type="submit">활성화</button></div>
  </form>
</dialog>
