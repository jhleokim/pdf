<dialog id="printDialog" class="pdf-save-dialog" aria-labelledby="printTitle" aria-describedby="printSummary">
  <header class="pdf-save-head"><div class="pdf-save-heading"><svg class="ic" aria-hidden="true"><use href="#i-printer"/></svg><div><h2 id="printTitle">문서 인쇄</h2><p id="printSummary"></p></div></div><button class="btn quiet icon" id="printClose" aria-label="인쇄 창 닫기"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></header>
  <div class="pdf-save-body"><p id="printStatus" role="status" aria-live="polite"></p><p class="pdf-save-note" id="printHelp">프린터와 인쇄할 페이지 범위는 브라우저 인쇄 창에서 선택합니다.</p><a id="printOpenPdf" class="print-pdf-link" target="_blank" rel="noopener">PDF 열기</a></div>
  <footer class="pdf-save-actions"><button class="btn" id="printBack">닫기</button><button class="btn primary" id="printRetry" disabled><svg class="ic" aria-hidden="true"><use href="#i-printer"/></svg><span>인쇄 창 열기</span></button></footer>
</dialog>
