<section id="textEditor" class="text-editor" role="dialog" aria-labelledby="textEditorTitle" hidden>
  <div class="text-editor-head"><strong id="textEditorTitle">텍스트 입력</strong><button class="btn quiet icon" id="textCancel" title="취소" aria-label="텍스트 입력 취소"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <textarea id="textInput" rows="4" maxlength="2000" placeholder="여기에 입력하세요" aria-label="추가할 텍스트" spellcheck="false"></textarea>
  <p id="textError" role="alert"></p>
  <div class="text-editor-foot"><span>Ctrl / ⌘ + Enter로 완료</span><button class="btn primary" id="textApply">완료</button></div>
</section>
