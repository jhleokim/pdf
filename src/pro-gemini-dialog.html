<dialog id="geminiDialog" class="gemini-dialog" aria-labelledby="geminiTitle">
  <form method="dialog">
    <h2 id="geminiTitle">Gemini로 인식하기</h2>
    <p id="geminiConfirmScope"></p>
    <p>인식할 페이지 이미지를 Cloudflare를 거쳐 Google Gemini로 전송합니다. 무료 API에서는 입력과 결과가 제품 개선과 사람의 검토에 사용될 수 있습니다.</p>
    <label class="gemini-consent"><input type="checkbox" id="geminiConsent">민감정보 없는 문서임을 확인합니다</label>
    <p class="pro-hint">개인정보와 사내 기밀정보가 포함된 문서는 기본 인식을 이용하세요. Gemini의 글자와 줄 위치는 틀릴 수 있으므로 결과를 확인한 후 PDF에 포함하세요.</p>
    <p id="geminiAvailability" class="pro-hint" role="status"></p>
    <div class="stamp-actions"><button class="btn" value="cancel">취소</button><button class="btn primary" id="geminiConfirm" type="button" disabled>확인하고 인식</button></div>
  </form>
</dialog>
